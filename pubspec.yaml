name: axiom
description: Axiom — premium language learning, zero paywalls.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Flick shared SDK — identity, event sensing, SQLite buffer, Edge AI
  flick_sdk:
    path: packages/flick_sdk

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Fonts & icons
  google_fonts: ^6.2.1

  # Local persistence
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Animations
  flutter_animate: ^4.5.0

  # Haptics
  flutter_haptic: ^0.0.1+1

  # SVG rendering (logotyp)
  flutter_svg: ^2.0.10+1

  # Media
  image_picker: ^1.1.2
  supabase_flutter: ^2.12.4

  # File system
  path_provider: ^2.1.1

  # URL launching (used for Google AI Studio deep link in onboarding)
  url_launcher: ^6.3.0

  # Speech recognition
  speech_to_text: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
